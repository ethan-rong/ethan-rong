<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
<style>
.sq{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(14px)}}
.probe{animation:wander 18s ease-in-out infinite}
@keyframes wander{0%,100%{transform:translate(250px,170px)}20%{transform:translate(470px,70px)}40%{transform:translate(720px,230px)}60%{transform:translate(930px,110px)}80%{transform:translate(560px,250px)}}
@media (prefers-reduced-motion:reduce){.sq,.probe{animation:none}}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<defs>
<clipPath id="mind"><circle cx="130" cy="150" r="80"/></clipPath>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#6e7781" fill-opacity=".28"/></pattern>
<pattern id="lit" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="2.3" fill="#3b5bdb"/></pattern>
<radialGradient id="lens"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#3b5bdb" stop-opacity=".16"/><stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/></radialGradient>
<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="300"><g class="probe"><circle r="120" fill="url(#lens)"/></g></mask>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#1f2328"/><stop offset=".55" stop-color="#1f2328"/><stop offset="1" stop-color="#6e7781" stop-opacity=".35"/></linearGradient>
</defs>
<!-- a dot field with a lens that wanders like a cursor -->
<rect width="1000" height="300" fill="url(#dots)"/>
<g class="probe"><circle r="170" fill="url(#halo)"/></g>
<rect width="1000" height="300" fill="url(#lit)" mask="url(#reveal)"/>
<!-- a circle, a square, and what they share -->
<circle cx="130" cy="150" r="80" fill="none" stroke="#1f2328" stroke-width="1.6"/>
<g class="sq"><rect x="152" y="90" width="120" height="120" fill="none" stroke="#1f2328" stroke-width="1.6"/></g>
<g clip-path="url(#mind)"><g class="sq"><rect x="152" y="90" width="120" height="120" fill="#3b5bdb"/></g></g>
<line x1="330" y1="70" x2="330" y2="230" stroke="#d0d7de" stroke-width="1"/>
<text x="372" y="112" class="sans" font-size="13" letter-spacing="3.2" fill="#6e7781">ETHAN RONG</text>
<text x="368" y="172" class="serif" font-size="50" fill="url(#fade)">Thinking about something.</text>
<text x="372" y="214" class="sans" font-size="14" letter-spacing=".4" fill="#6e7781">AI · Cognitive Science · Information Science</text>
</svg>
